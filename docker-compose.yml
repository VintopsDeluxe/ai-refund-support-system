services:
  database:
    image: postgres:16
    container_name: worknoon-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: worknoon
      POSTGRES_USER: worknoon
      POSTGRES_PASSWORD: worknoon_password
    ports:
      - "5432:5432"
    volumes:
      - worknoon_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: worknoon-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    depends_on:
      - database

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: worknoon-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  worknoon_postgres_data: